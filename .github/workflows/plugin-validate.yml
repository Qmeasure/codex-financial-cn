name: 插件校验

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验 Codex 根插件结构
        run: python3 scripts/check.py

      - name: 校验 Codex manifest
        run: python3 scripts/validate_plugin.py .

      - name: 校验中文化
        run: python3 scripts/check_cn_localization.py

      - name: 校验中文产物样例
        run: |
          set -euo pipefail
          python3 -m pip install --user openpyxl python-pptx
          python3 scripts/check_cn_artifact_samples.py
